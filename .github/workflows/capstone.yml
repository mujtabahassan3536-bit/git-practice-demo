name: Phase A Final Test
on:
  push: 
    branches: ["feature/practice"]

job:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
        python-version: "3.10"

      - name: Test Secret Injection
        env:
          MY-KEY: ${{secrets.MY-API-KEY}}
        run:
          echo "Testing secret injection..."
          echo "Key is: $MY_KEY"

      - name: Run Math Test
        run: 
          python -c "print(25 * 4)"

  notify-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Send Notification
        run: |
          echo "Pipeline passed! Proceeding to deployment..."
