name: Practice

on:
  push:
    branches: [ "feature/practice" ]
  pull_request:
    branches: [ "feature/practice" ]

jobs:
  practice-job:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run practice math test
        run: |
          echo "Running my custom practice script..."
          python -c "print(100 + 200)"

      - name: Use GitHub Secret safely
        env:
          SECRET_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "Secret key successfully fetched!"
          echo "Value is: $SECRET_KEY"