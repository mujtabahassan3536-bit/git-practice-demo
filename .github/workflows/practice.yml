name: Practice Matrix Strategy

on:
  push:
    branches: [ "feature/practice" ]

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Test on Python Version
        run: |
          echo "Testing code on Python version: ${{ matrix.python-version }}"
          python --version