name: Practice Caching Strategy

on:
  push:
    branches: [ "feature/practice" ]

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python with Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Sample Package
        run: |
          pip install requests