name: Practice Multi Job Pipeline

on:
  push:
    branches: [ "feature/practice" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Running unit tests for backend..."
          pythoon -c "print('All tests passed!')"

  deploy-docker:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Build and Push Docker Image
        run: |
          echo "Building FastAPI Docker Image..."
          echo "Docker container successfully deployed!"